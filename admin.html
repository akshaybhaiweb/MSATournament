<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Tournament Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  background:#0b0b0f;
  color:#fff;
  min-height:100vh;
}

header{
  background:#15151d;
  padding:22px;
  text-align:center;
  border-bottom:1px solid #292936;
}

header h1{font-size:25px;margin-bottom:6px}
header p{color:#999;font-size:13px}

.container{
  width:95%;
  max-width:1400px;
  margin:25px auto;
}

.status,.section,.card{
  background:#15151d;
  border:1px solid #292936;
  border-radius:12px;
}

.status{
  padding:15px;
  margin-bottom:20px;
}

.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#777;
  margin-right:8px;
}

.dot.online{
  background:#00d26a;
  box-shadow:0 0 10px #00d26a;
}

.dot.offline{
  background:#ff3333;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  padding:20px;
  text-align:center;
}

.card h3{
  color:#999;
  font-size:12px;
  margin-bottom:10px;
}

.card strong{font-size:27px}

.section{
  padding:20px;
  margin-bottom:20px;
}

.section h2{margin-bottom:18px}

.slots{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:8px;
}

.slot{
  background:#20202a;
  border:1px solid #30303c;
  border-radius:8px;
  min-height:55px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-size:12px;
}

.slot.booked{
  background:#3a2020;
  border-color:#9b3b3b;
}

.slot b{
  font-size:15px;
  margin-bottom:3px;
}

.slot small{
  color:#999;
  max-width:90%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

input,select{
  background:#20202a;
  color:white;
  border:1px solid #383844;
  border-radius:8px;
  padding:11px;
  outline:none;
}

.search{flex:1}

.table-wrap{overflow-x:auto}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,td{
  padding:11px;
  border-bottom:1px solid #292936;
  text-align:left;
  font-size:13px;
}

th{
  color:#999;
  background:#191921;
  font-size:11px;
}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}

.paid{
  background:#123d29;
  color:#52e89b;
}

.pending{
  background:#403515;
  color:#f4c84a;
}

button{
  border:0;
  border-radius:7px;
  padding:8px 10px;
  cursor:pointer;
  color:white;
  font-weight:bold;
  font-size:11px;
  margin:2px;
}

button:hover{opacity:.8}

.paid-btn{background:#198754}
.pending-btn{background:#765f16}
.result-btn{background:#3159a8}
.remove-btn{background:#a83232
