<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FF Tournament Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #ff9800;
      margin-bottom: 20px;
    }

    button {
      display: block;
      margin: 0 auto 20px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #2196f3;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      text-align: center;
      background: #151515;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #111;
    }

    th,
    td {
      padding: 12px;
      border: 1px solid #292929;
      text-align: center;
    }

    th {
      background: #222;
      color: #ff9800;
    }

    .empty {
      text-align: center;
      padding: 30px;
      background: #151515;
      border-radius: 8px;
      color: #aaa;
    }

    .error {
      color: #ff5252;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔥 FF Tournament Admin 🔥</h1>

    <button onclick="loadPlayers()">🔄 Refresh Players</button>

    <div id="status" class="status">
      Loading players...
    </div>

    <div id="content"></div>

  </div>

  <script>
    async function loadPlayers() {

      const status = document.getElementById("status");
      const content = document.getElementById("content");

      status.textContent = "Loading players...";
      content.innerHTML = "";

      try {

        const response = await fetch("/api/players", {
          method: "GET",
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status
          );
        }

        const players = await response.json();

        console.log("API:", players);

        if (!Array.isArray(players)) {
          throw new Error(
            "API did not return an array"
          );
        }

        if (players.length === 0) {

          status.textContent = "API connected ✅";

          content.innerHTML = `
            <div class="empty">
              📭 No players registered yet.
            </div>
          `;

          return;
        }

        status.textContent =
          "Players loaded: " + players.length + " ✅";

        let html = `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Slot</th>
                  <th>Player Name</th>
                  <th>UID</th>
                  <th>IGN</th>
                  <th>Payment</th>
                  <th>Kills</th>
                  <th>Booyah</th>
                  <th>Bonus</th>
                </tr>
              </thead>

              <tbody>
        `;

        players.forEach(function(player) {

          html += `
            <tr>
              <td>${player.slot ?? "-"}</td>
              <td>${player.player_name ?? "-"}</td>
              <td>${player.uid ?? "-"}</td>
              <td>${player.ign ?? "-"}</td>
              <td>${player.payment ?? "pending"}</td>
              <td>${player.kills ?? 0}</td>
              <td>${player.booyah ? "YES 👑" : "NO"}</td>
              <td>₹${player.bonus ?? 0}</td>
            </tr>
          `;

        });

        html += `
              </tbody>
            </table>
          </div>
        `;

        content.innerHTML = html;

      } catch (error) {

        console.error("Players API Error:", error);

        status.textContent = "❌ API request failed";

        content.innerHTML = `
          <div class="empty error">
            Failed to fetch players.<br><br>
            ${error.message}
          </div>
        `;
      }
    }

    // Load automatically when Admin opens
    loadPlayers();
  </script>

</body>
</html>
